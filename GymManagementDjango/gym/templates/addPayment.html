{% include 'admin_nav.html' %}
{% load static %}
<head>
    <title>Add Payment</title>
</head>

<div class="container mt-5">
    <h2 class="text-center">Add Payment Record</h2>
    <hr>
    <div class="row">
        <div class="col-sm-2"></div>
        <div class="col-sm-8">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Member</label>
                            <select name="member" class="form-control" required>
                                <option value="">Select Member</option>
                                {% for m in members %}
                                <option value="{{ m.id }}">{{ m.name }} ({{ m.contact }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Amount (₹)</label>
                            <input type="number" step="1" name="amount" placeholder="Enter Amount in Rupees" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Payment Date</label>
                            <input type="date" name="payment_date" value="{{ today|date:'Y-m-d' }}" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Payment Method</label>
                            <select name="payment_method" class="form-control" required>
                                <option value="cash">Cash</option>
                                <option value="credit_card">Credit Card</option>
                                <option value="debit_card">Debit Card</option>
                                <option value="bank_transfer">Bank Transfer</option>
                                <option value="online">Online Payment</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Reference Number</label>
                            <input type="text" name="reference_number" placeholder="Enter Reference Number (Optional)" class="form-control">
                        </div>
                        
                        <div class="form-group">
                            <label>Notes</label>
                            <textarea class="form-control" name="notes" placeholder="Enter Payment Notes (Optional)"></textarea>
                        </div>
                        
                        <input type="submit" value="Record Payment" class="btn btn-primary btn-block">
                    </form>
                </div>
            </div>
        </div>
        <div class="col-sm-2"></div>
    </div>
</div>

{% if error == "yes" %}
<script>
    alert('Something went wrong, try again!');
    window.location = '{% url "addPayment" %}';
</script>
{% endif %}

{% if error == "no" %}
<script>
    alert('Payment recorded successfully!');
    window.location = '{% url "viewPayments" %}';
</script>
{% endif %}
