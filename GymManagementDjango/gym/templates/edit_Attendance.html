{% include 'admin_nav.html' %}
{% load static %}
<head>
    <title>Edit Attendance</title>
</head>

<div class="container mt-5">
    <h2 class="text-center">Edit Attendance Record</h2>
    <hr>
    <div class="row">
        <div class="col-sm-2"></div>
        <div class="col-sm-8">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Member</label>
                            <select name="member" class="form-control" required>
                                <option value="">Select Member</option>
                                {% for m in members %}
                                <option value="{{ m.id }}" {% if attendance.member.id == m.id %}selected{% endif %}>
                                    {{ m.name }} ({{ m.contact }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" name="date" value="{{ attendance.date|date:'Y-m-d' }}" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Check-In Time</label>
                            <input type="time" name="check_in" value="{{ attendance.check_in|time:'H:i' }}" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Check-Out Time (Optional)</label>
                            <input type="time" name="check_out" value="{{ attendance.check_out|default_if_none:''|time:'H:i' }}" class="form-control">
                        </div>
                        
                        <div class="form-group">
                            <label>Note (Optional)</label>
                            <textarea class="form-control" name="note">{{ attendance.note }}</textarea>
                        </div>
                        
                        <input type="submit" value="Update Attendance" class="btn btn-primary btn-block">
                    </form>
                </div>
            </div>
        </div>
        <div class="col-sm-2"></div>
    </div>
</div>

{% if error == "yes" %}
<script>
    alert('Something went wrong, try again!');
    window.location = '{% url "edit_Attendance" attendance.id %}';
</script>
{% endif %}

{% if error == "no" %}
<script>
    alert('Attendance updated successfully!');
    window.location = '{% url "viewAttendance" %}';
</script>
{% endif %}
